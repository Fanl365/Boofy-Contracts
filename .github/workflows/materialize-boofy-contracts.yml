name: Materialize Boofy Contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-boofy-contracts.yml'
      - 'tools/materialize_boofy_contracts.py'

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Boofy repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve materializer workflow and script
        shell: bash
        run: |
          cp tools/materialize_boofy_contracts.py /tmp/materialize_boofy_contracts.py
          cp .github/workflows/materialize-boofy-contracts.yml /tmp/materialize-boofy-contracts.yml

      - name: Fetch upstream Beefy Contracts
        run: git clone --depth 1 https://github.com/beefyfinance/beefy-contracts.git /tmp/beefy-contracts

      - name: Replace workspace with upstream source
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/beefy-contracts/ ./
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/materialize-boofy-contracts.yml .github/workflows/materialize-boofy-contracts.yml

      - name: Materialize Boofy source tree
        run: python /tmp/materialize_boofy_contracts.py .

      - name: Commit complete source tree
        shell: bash
        run: |
          git config user.name "Boofy"
          git config user.email "fanlong.365@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: materialize complete Boofy Contracts source tree [materialized]"
          git push origin HEAD:main

name: Render Boofy Branding

on:
  push:
    branches: [main]
    paths:
      - 'branding/boofy-logo.svg'
      - '.github/workflows/render-boofy-branding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Render PNG assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          for s in 32 64 128 256 512 1024; do
            rsvg-convert -w $s -h $s branding/boofy-logo.svg -o branding/boofy-token-$s.png
          done
          cp branding/boofy-token-1024.png branding/boofy-logo-source.png
      - name: Commit branding assets
        run: |
          git config user.name "Boofy"
          git config user.email "fanlong.365@gmail.com"
          git add branding/*.png
          git diff --cached --quiet && exit 0
          git commit -m "brand: add Boofy token PNG asset set"
          git push origin HEAD:main
